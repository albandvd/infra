# Démo de test du socle : le plus petit projet possible, mais construit
# exactement comme le seront les vraies démos du portfolio.
#
# Déploiement (la démo est un projet Compose à part entière) :
#   cd ~/infra/examples/whoami && docker compose up -d
#
# À retenir pour copier ce modèle :
#   - le réseau `proxy` est externe : c'est le socle qui le possède ;
#   - aucun port publié : Traefik joint le conteneur par le réseau `proxy` ;
#   - `traefik.enable=true` est obligatoire (exposedByDefault est à false) ;
#   - `traefik.docker.allownonrunning=true` garde la route vivante quand
#     Sablier a endormi le conteneur ;
#   - un `mem_limit`, pour ne pas déborder du budget des démos.

networks:
  proxy:
    external: true

services:
  whoami:
    image: traefik/whoami:v1.12.0
    # Pas de healthcheck ici : l'image est construite FROM scratch, sans shell.
    # Sablier avertit donc qu'il ne peut pas détecter la disponibilité et se
    # rabat sur « conteneur démarré = prêt ». Une vraie démo doit définir un
    # healthcheck : Sablier garde alors la page d'attente jusqu'à ce qu'elle
    # réponde vraiment.
    # unless-stopped et non always : quand Sablier arrête le conteneur,
    # Docker doit le laisser arrêté.
    restart: unless-stopped
    networks: [proxy]
    mem_limit: 32m
    labels:
      # --- Sablier : qui gérer, et sous quel nom de groupe
      - sablier.enable=true
      - sablier.group=whoami

      # --- Le middleware Sablier pour cette démo
      - traefik.http.middlewares.whoami-sablier.plugin.sablier.group=whoami
      - traefik.http.middlewares.whoami-sablier.plugin.sablier.sablierUrl=http://sablier:10000
      # Surchargeable pour un test sans toucher au fichier :
      #   WHOAMI_SESSION_DURATION=1m docker compose up -d
      - traefik.http.middlewares.whoami-sablier.plugin.sablier.sessionDuration=${WHOAMI_SESSION_DURATION:-10m}
      - traefik.http.middlewares.whoami-sablier.plugin.sablier.dynamic.displayName=whoami
      # Les sondes d'Uptime Kuma ne doivent pas réveiller la démo en continu,
      # sinon elle ne s'endort jamais. Elles reçoivent un 200 immédiat.
      - traefik.http.middlewares.whoami-sablier.plugin.sablier.ignoreUserAgent[0]=(?i)uptime-kuma

      # --- Routage Traefik
      - traefik.enable=true
      # Depuis Traefik v3.6 : garde la route déclarée même conteneur arrêté.
      - traefik.docker.allownonrunning=true
      - traefik.http.routers.whoami.rule=Host(`test.albandavid.com`)
      - traefik.http.routers.whoami.entrypoints=web
      - traefik.http.routers.whoami.middlewares=security-headers@file,whoami-sablier@docker
      - traefik.http.services.whoami.loadbalancer.server.port=80
