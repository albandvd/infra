# Socle d'exposition publique du homelab.
#
# Chaîne d'une requête :
#   visiteur -> Cloudflare -> cloudflared (tunnel sortant) -> traefik:80 -> démo
#
# Aucun port n'est publié sur l'hôte pour le trafic public : le tunnel est une
# connexion sortante. Les seuls ports publiés le sont sur 127.0.0.1 de la VM,
# pour l'administration par tunnel SSH.

networks:
  proxy:
    external: true
  socket-traefik:
    internal: true   # pas d'accès internet : seulement Traefik <-> son proxy
  socket-sablier:
    internal: true   # seulement Sablier <-> son proxy

volumes:
  # Base SQLite, sondes et réglages d'Uptime Kuma. Volume nommé : aucune
  # donnée d'exécution ne traîne dans le repo.
  uptime-kuma-data:
  # Cache des plugins Traefik. Sans lui, Traefik retélécharge le plugin Sablier
  # depuis GitHub à chaque redémarrage, et ne démarre pas si GitHub est injoignable.
  traefik-plugins:

services:
  # Lecture seule : Traefik lit la liste des conteneurs et leurs labels
  socket-proxy-traefik:
    image: lscr.io/linuxserver/socket-proxy:3.4.7-r0-ls104
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1   # lister et inspecter les conteneurs
      - POST=0         # aucune écriture
    networks: [socket-traefik]
    mem_limit: 32m

  # Lecture + cycle de vie des conteneurs, pour Sablier.
  socket-proxy-sablier:
    image: lscr.io/linuxserver/socket-proxy:3.4.7-r0-ls104
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      # POST reste à 0, contrairement à ce que demande la doc de Sablier.
      #
      # Pourquoi la doc demande POST=1 : après avoir arrêté un conteneur,
      # Sablier appelle POST /containers/{id}/wait pour confirmer l'arrêt, et
      # le proxy n'a pas de drapeau ALLOW_WAIT pour ce seul appel.
      #
      # Pourquoi on refuse quand même : avec CONTAINERS=1, POST=1 laisse aussi
      # passer POST /containers/{id}/exec — mesuré ici, HTTP 201, malgré
      # EXEC=0, que la règle CONTAINERS prend de vitesse. Un Sablier compromis
      # obtiendrait alors l'exécution de commandes dans tous les conteneurs de
      # l'hôte, ce qui annule l'intérêt même du proxy.
      #
      # Ce qu'on paie à la place : ALLOW_STOP suffit à arrêter le conteneur
      # (vérifié : deux cycles complets d'affilée), mais le /wait qui suit est
      # refusé, donc Sablier journalise deux lignes ERR « cannot wait for
      # container ... 403 Forbidden » à chaque extinction. C'est cosmétique :
      # le conteneur est bel et bien arrêté. Voir le README.
      - POST=0
    networks: [socket-sablier]
    mem_limit: 32m

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [proxy]
    mem_limit: 64m

  traefik:
    image: traefik:v3.7.18
    restart: unless-stopped
    depends_on: [socket-proxy-traefik]
    # Rien sur 0.0.0.0. Le dashboard n'est joignable que depuis la VM :
    #   ssh -L 8080:127.0.0.1:8080 homelab-vm   puis   http://127.0.0.1:8080/
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-plugins:/plugins-storage
    networks: [proxy, socket-traefik]
    mem_limit: 128m

  sablier:
    image: sablierapp/sablier:1.18.0
    restart: unless-stopped
    command: ["start"]
    depends_on: [socket-proxy-sablier]
    environment:
      # Jamais /var/run/docker.sock : Sablier ne peut que lister, démarrer
      # et arrêter, à travers son propre proxy.
      - DOCKER_HOST=tcp://socket-proxy-sablier:2375
    volumes:
      - ./sablier/sablier.yml:/etc/sablier/sablier.yml:ro
    # `proxy` pour que Traefik joigne son API, `socket-sablier` pour Docker.
    networks: [proxy, socket-sablier]
    mem_limit: 96m

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    # Administration : uniquement depuis la VM.
    #   ssh -L 3001:127.0.0.1:3001 homelab-vm   puis   http://127.0.0.1:3001/
    ports:
      - "127.0.0.1:3001:3001"
    networks: [proxy]
    mem_limit: 320m
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma-status.entrypoints=web
      - traefik.http.routers.kuma-status.middlewares=security-headers@file
      - traefik.http.services.kuma-status.loadbalancer.server.port=3001
      # Liste blanche de chemins. Uptime Kuma sert son SPA sur `app.get("*")`,
      # donc sans cette restriction /dashboard renverrait la page d'admin.
      # Chemins relevés dans le code de la 2.5.9 :
      #   - server/routers/status-page-router.js : /status/:slug, /status,
      #     /status-page, /api/status-page/* (config, heartbeat, manifest,
      #     incident-history, badge) ;
      #   - server/server.js : les assets du SPA (dist/ servi à la racine,
      #     donc /assets/* + les icônes de public/) et /upload/* pour un logo.
      # Volontairement absents : /socket.io/* (tout l'admin, et l'authentification
      # elle-même, passent par là : sans lui, impossible de se connecter depuis
      # internet), /dashboard, /setup, /metrics, /api/* hors status-page.
      - >-
        traefik.http.routers.kuma-status.rule=Host(`status.albandavid.com`)
        && ( Path(`/status`)
        || Path(`/status-page`)
        || PathPrefix(`/status/`)
        || PathPrefix(`/api/status-page/`)
        || PathPrefix(`/assets/`)
        || PathPrefix(`/upload/`)
        || Path(`/favicon.ico`)
        || Path(`/icon.svg`)
        || Path(`/icon.png`)
        || Path(`/icon-192x192.png`)
        || Path(`/icon-512x512.png`)
        || Path(`/apple-touch-icon.png`)
        || Path(`/manifest.json`)
        || Path(`/robots.txt`) )
